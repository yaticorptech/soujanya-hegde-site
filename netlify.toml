[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — client-side router handles the paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# long-cache immutable assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imgw/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
